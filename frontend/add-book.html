<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book | Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container navbar">

        <div class="logo">
            <div class="logo-icon">📚</div>
            <div>
                <h2>Library Management System</h2>
            </div>
        </div>

        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="add-book.html" class="active">Add Book</a></li>
                <li><a href="issue-book.html">Issue Book</a></li>
                <li><a href="return-book.html">Return Book</a></li>
            </ul>
        </nav>

    </div>
</header>

<section class="hero">

    <div class="container">

        <div class="form-card">

            <h1 class="form-title">
                Add New Book
            </h1>

            <div id="message" class="message"></div>

            <form id="addBookForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="title">Book Title</label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="author">Author</label>
                        <input
                            type="text"
                            id="author"
                            name="author"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input
                            type="text"
                            id="isbn"
                            name="isbn"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <input
                            type="text"
                            id="category"
                            name="category"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="year">Published Year</label>
                        <input
                            type="number"
                            id="year"
                            name="year"
                            min="1000"
                            max="9999"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="quantity">Total Quantity</label>
                        <input
                            type="number"
                            id="quantity"
                            name="quantity"
                            min="1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="available">Available Quantity</label>
                        <input
                            type="number"
                            id="available"
                            name="available"
                            min="0"
                            required
                        >
                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Add Book
                    </button>

                    <button
                        type="reset"
                        class="btn btn-outline"
                    >
                        Reset
                    </button>

                    <a
                        href="books.html"
                        class="btn btn-primary"
                    >
                        View Books
                    </a>

                </div>

            </form>

        </div>

    </div>

</section>

<footer>
    © 2026 Library Management System | Node.js • Express.js • MongoDB
</footer>

<script src="script.js"></script>

</body>
</html>
